<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1019">
  <meta name="description" content="universeでつくったブラウザゲームの一覧。1ボタン、パズル、音楽、推理、アクションを遊べます。">
  <title>universe games</title>
<style>
    :root {
      --bg: #080d16;
      --panel: #111a2a;
      --panel-2: #172238;
      --line: #26344e;
      --text: #edf4ff;
      --muted: #93a5c2;
      --gold: #ffd166;
      --cyan: #57f6ff;
      --pink: #ff6ad5;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(1100px 700px at 50% -10%, #1a2b4a 0%, transparent 65%),
        radial-gradient(700px 500px at 100% 30%, #2a103d 0%, transparent 55%),
        var(--bg);
      font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }
    a { color: inherit; }
    .wrap { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 64px 0 28px; }
    .eyebrow {
      color: var(--cyan);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      margin: 0 0 10px;
    }
    h1 {
      margin: 0;
      font-size: clamp(38px, 7vw, 76px);
      line-height: 1;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #fff 10%, #a9c8ff 55%, #7f6dff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle { color: var(--muted); margin: 14px 0 0; font-size: clamp(13px, 2vw, 16px); }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 28px 0 14px;
    }
    .filter {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(17, 26, 42, 0.8);
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 13px;
      cursor: pointer;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .filter:hover { color: var(--text); border-color: #46618e; }
    .filter.active {
      color: #071018;
      background: var(--gold);
      border-color: var(--gold);
    }
    .result-count { color: var(--muted); font-size: 12px; margin: 0 0 18px; }
    .cards {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    .game-card { min-width: 0; }
    .game-card[hidden] { display: none; }
    .card-link {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, var(--panel-2), var(--panel));
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .card-link:hover, .card-link:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(255, 209, 102, 0.7);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      outline: none;
    }
    .thumb {
      position: relative;
      margin: 0;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      background: #03060c;
    }
    .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s ease;
    }
    .card-link:hover .thumb img { transform: scale(1.035); }
    .tag {
      position: absolute;
      top: 12px;
      left: 12px;
      color: #101722;
      background: var(--gold);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 9px;
      padding: 16px 17px 17px;
    }
    .card-body h2 { margin: 0; font-size: 19px; line-height: 1.35; }
    .card-body p {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.65;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: auto 0 0;
      padding: 4px 0 0;
      list-style: none;
    }
    .tags li {
      color: #a9c6ff;
      background: rgba(87, 246, 255, 0.08);
      border: 1px solid rgba(87, 246, 255, 0.18);
      border-radius: 5px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
    }
    .play {
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    footer {
      margin-top: 56px;
      padding: 24px 0 40px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }
    code { color: var(--gold); font-family: ui-monospace, Menlo, monospace; }
    @media (max-width: 640px) {
      header { padding-top: 42px; }
      .wrap { width: min(100% - 22px, 1180px); }
      .cards { grid-template-columns: 1fr; gap: 15px; }
      .card-body p { -webkit-line-clamp: 4; }
      .filters { gap: 6px; }
      .filter { font-size: 11px; padding: 6px 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
    }
      .list-status {
      grid-column: 1 / -1;
      color: var(--muted);
      text-align: center;
      padding: 48px 12px;
      font-size: 13px;
    }
    .list-status.error { color: #ff9aae; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <p class="eyebrow">UNIVERSE / GAMES</p>
      <h1>つくったゲーム</h1>
      <p class="subtitle">1ボタン、パズル、音楽、推理、アクション。ブラウザですぐ遊べます。</p>
      <nav class="filters" id="filters" aria-label="ジャンルで絞り込む"></nav>
      <p class="result-count" id="result-count">読み込み中...</p>
    </header>

    <main>
      <ul class="cards" id="game-grid">
        <li class="list-status" id="list-status">ゲーム一覧を読み込んでいます...</li>
      </ul>
      <noscript>
        <p class="list-status">一覧の表示にはJavaScriptが必要です。<a href="https://github.com/takuto277/universe">GitHub</a>から各ゲームを開けます。</p>
      </noscript>
    </main>

    <footer>
      <p>各ゲームは依存ゼロの静的ファイルです。ローカルで動かすには <code>python3 -m http.server</code> をリポジトリ直下で実行してください。</p>
      <p><a href="https://github.com/takuto277/universe">GitHub / takuto277/universe</a></p>
    </footer>
  </div>

  <script>
    (function () {
      var grid = document.getElementById('game-grid');
      var filters = document.getElementById('filters');
      var count = document.getElementById('result-count');
      var status = document.getElementById('list-status');

      function tagList(app) {
        return (app.tags || []).filter(function (tag) { return typeof tag === 'string' && tag; });
      }

      function makeCard(app) {
        var li = document.createElement('li');
        li.className = 'game-card';
        li.setAttribute('data-tags', tagList(app).join(' '));

        var link = document.createElement('a');
        link.className = 'card-link';
        link.href = app.path;
        link.setAttribute('data-app', app.id);

        var figure = document.createElement('figure');
        figure.className = 'thumb';
        var img = document.createElement('img');
        img.src = app.thumbnail;
        img.alt = app.title + 'のゲームプレイ';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.width = 1200;
        img.height = 800;
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = app.tag || 'GAME';
        figure.appendChild(img);
        figure.appendChild(tag);

        var body = document.createElement('div');
        body.className = 'card-body';
        var title = document.createElement('h2');
        title.textContent = app.title;
        var description = document.createElement('p');
        description.textContent = app.description;
        var tags = document.createElement('ul');
        tags.className = 'tags';
        tagList(app).forEach(function (name) {
          var item = document.createElement('li');
          item.textContent = name;
          tags.appendChild(item);
        });
        var play = document.createElement('span');
        play.className = 'play';
        play.textContent = '遊ぶ →';

        body.appendChild(title);
        body.appendChild(description);
        body.appendChild(tags);
        body.appendChild(play);
        link.appendChild(figure);
        link.appendChild(body);
        li.appendChild(link);
        return li;
      }

      function apply(filter) {
        var cards = Array.prototype.slice.call(grid.querySelectorAll('.game-card'));
        var shown = 0;
        cards.forEach(function (card) {
          var names = (card.getAttribute('data-tags') || '').split(' ');
          var visible = filter === 'all' || names.indexOf(filter) >= 0;
          card.hidden = !visible;
          if (visible) shown++;
        });
        Array.prototype.slice.call(filters.querySelectorAll('.filter')).forEach(function (button) {
          var active = button.getAttribute('data-filter') === filter;
          button.classList.toggle('active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        count.textContent = shown + ' 本のゲーム';
      }

      function makeFilters(tags) {
        var all = document.createElement('button');
        all.type = 'button';
        all.className = 'filter active';
        all.setAttribute('data-filter', 'all');
        all.setAttribute('aria-pressed', 'true');
        all.textContent = 'すべて';
        all.addEventListener('click', function () { apply('all'); });
        filters.appendChild(all);
        tags.forEach(function (tag) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'filter';
          button.setAttribute('data-filter', tag);
          button.setAttribute('aria-pressed', 'false');
          button.textContent = tag;
          button.addEventListener('click', function () { apply(tag); });
          filters.appendChild(button);
        });
      }

      fetch('apps.json', { cache: 'no-cache' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function (data) {
          var apps = Array.isArray(data.apps) ? data.apps : [];
          var tags = [];
          apps.forEach(function (app) {
            tagList(app).forEach(function (tag) {
              if (tags.indexOf(tag) < 0) tags.push(tag);
            });
          });
          if (status) status.remove();
          grid.innerHTML = '';
          apps.forEach(function (app) { grid.appendChild(makeCard(app)); });
          makeFilters(tags);
          apply('all');
        })
        .catch(function (error) {
          if (status) {
            status.className = 'list-status error';
            status.textContent = 'ゲーム一覧を読み込めませんでした: ' + error.message;
          }
          count.textContent = '';
        });
    })();
  </script>
</body>
</html>
