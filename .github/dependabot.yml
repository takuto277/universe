version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    labels:
      - "area:automation"
      - "priority:p3"
    open-pull-requests-limit: 5

# .opencode の npm 依存は manifest を追跡していないため Dependabot の対象外。
# 更新方法は SECURITY.md を参照。
