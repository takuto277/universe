name: Experiment guard

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  label:
    if: startsWith(github.head_ref, 'experiment/') && github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'experiment:keep')
    runs-on: ubuntu-latest
    steps:
      - name: Keep experiment PRs out of auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label "experiment:preview" \
            --add-label "do-not-merge"
