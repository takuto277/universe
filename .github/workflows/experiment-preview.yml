name: Experiment preview

on:
  push:
    branches:
      - "experiment/**"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: experiment-preview-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event_name == 'push' || (startsWith(github.head_ref, 'experiment/') && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate site
        run: python3 tools/check_site.py

      - name: Build static preview
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tools/' \
            --exclude='docs/' \
            --exclude='*.md' \
            ./ "$RUNNER_TEMP/site/"
          printf 'User-agent: *\nDisallow: /\n' >"$RUNNER_TEMP/site/robots.txt"

      - name: Deploy to preview site
        id: deploy
        env:
          PREVIEW_DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_DEPLOY_KEY:-}" ]; then
            echo "::error::PREVIEW_DEPLOY_KEY is not set"
            exit 1
          fi
          slug="${BRANCH#experiment/}"
          slug="$(printf '%s' "$slug" | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          [ -n "$slug" ] || slug="preview"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PREVIEW_DEPLOY_KEY" >"$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan github.com >>"$HOME/.ssh/known_hosts" 2>/dev/null

          rm -rf "$RUNNER_TEMP/preview"
          git clone --depth 1 git@github.com:takuto277/universe-preview.git "$RUNNER_TEMP/preview"
          rm -rf "$RUNNER_TEMP/preview/experiments/$slug"
          mkdir -p "$RUNNER_TEMP/preview/experiments/$slug"
          rsync -a "$RUNNER_TEMP/site/" "$RUNNER_TEMP/preview/experiments/$slug/"

          cd "$RUNNER_TEMP/preview"
          git config user.name "takuto277"
          git config user.email "takuto277@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "preview is unchanged"
          else
            git commit -m "preview: $slug ($GITHUB_SHA)"
            pushed=0
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin main || true
              if git push origin main; then
                pushed=1
                break
              fi
              sleep 3
            done
            [ "$pushed" = 1 ]
          fi
          url="https://takuto277.github.io/universe-preview/experiments/$slug/"
          echo "PREVIEW_URL=$url" >>"$GITHUB_ENV"
          echo "url=$url" >>"$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: env.PR_NUMBER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "実験プレビュー: $PREVIEW_URL"

  playtest:
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/playtest/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Wait for preview to be ready
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 6
          done
          echo "preview did not become ready: $URL (last HTTP $code)" >&2
          exit 1

      - name: Play preview in Chromium
        run: |
          python tools/playtest/playtest.py \
            --base-url "${{ needs.preview.outputs.url }}" \
            --all \
            --seconds 4 \
            --screenshots "$RUNNER_TEMP/playtest-screenshots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-playtest-screenshots
          path: ${{ runner.temp }}/playtest-screenshots
          if-no-files-found: ignore
